# /etc/nginx/sites-available/asdem-pijamy.shop
# SSL-строки допишет certbot --nginx -d asdem-pijamy.shop -d www.asdem-pijamy.shop
server {
    listen 80;
    server_name asdem-pijamy.shop www.asdem-pijamy.shop;

    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/manifest+json;

    # www → основной домен (после certbot перенести в https-блок)
    if ($host = www.asdem-pijamy.shop) {
        return 301 https://asdem-pijamy.shop$request_uri;
    }

    # Маркет (Express) сам отдаёт SPA, /api, /uploads, robots.txt и sitemap.xml
    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
