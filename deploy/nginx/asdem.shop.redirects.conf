# Вставить в server { listen 443 … server_name asdem.shop; } перед location /
# Старые ссылки на модели второго филиала (?branch=asdem2) ведут на новый сайт; id моделей те же.
location ~ ^/product/(\d+)$ {
    if ($arg_branch = "asdem2") {
        return 301 https://asdem-pijamy.shop/product/$1;
    }
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Фото CRM второго филиала из старых превью в мессенджерах
location ^~ /api/crm-photos/asdem2/ {
    return 301 https://asdem-pijamy.shop$request_uri;
}
